openapi: 3.1.0
info:
  title: VPN Sentry API
  version: 0.1.0
  description: Contrato REST compartilhado entre os portais VPN e o backend Sentry.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verifica a disponibilidade do Sentry
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /cities:
    get:
      operationId: listCities
      summary: Lista configurações públicas de cidade
      responses:
        '200':
          description: Cidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityConfig'
  /posts:
    get:
      operationId: listPosts
      summary: Lista matérias publicadas
      parameters:
        - name: cidade
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Matérias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
  /me:
    get:
      security:
        - bearerAuth: []
      operationId: getMe
      responses:
        '200':
          description: Solicitação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /me/openai-credential:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getOpenAiCredentialStatus
      responses:
        '200':
          description: Informa se o usuário configurou uma chave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAiCredentialStatus' }
        '401':
          description: Não autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      security: [{ bearerAuth: [] }]
      operationId: saveOpenAiCredential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAiCredentialUpdate' }
      responses:
        '200':
          description: Chave armazenada de forma criptografada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAiCredentialStatus' }
        '400':
          description: Chave inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Não autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      security: [{ bearerAuth: [] }]
      operationId: deleteOpenAiCredential
      responses:
        '200':
          description: Chave removida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAiCredentialStatus' }
        '401':
          description: Não autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /provider-connections/twitch/authorize:
    post:
      security:
        - bearerAuth: []
      operationId: authorizeTwitch
      parameters:
        - name: X-OAuth-Nonce
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [consentVersion, consentAccepted]
                  properties:
                    consentVersion: { type: string, const: monitoring-v1 }
                    consentAccepted: { type: boolean, const: true }
                - type: object
                  additionalProperties: false
                  required: [consentVersion, consentAccepted, capabilities]
                  properties:
                    consentVersion: { type: string, const: clip-processing-v1 }
                    consentAccepted: { type: boolean, const: true }
                    capabilities:
                      type: array
                      minItems: 1
                      maxItems: 1
                      uniqueItems: true
                      items: { $ref: '#/components/schemas/ClipCapability' }
      responses:
        '200':
          description: Solicitação concluída
          content:
            application/json:
              schema:
                type: object
                required:
                  - authorizationUrl
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
        '400':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /provider-connections/twitch/callback:
    get:
      security:
        - bearerAuth: []
      operationId: completeTwitchAuthorization
      parameters:
        - name: X-OAuth-Nonce
          in: header
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '303':
          description: Retorno fixo ao Monitor
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /provider-connections/twitch:
    get:
      security:
        - bearerAuth: []
      operationId: getTwitchConnection
      responses:
        '200':
          description: Solicitação concluída
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TwitchConnection'
                  - type: 'null'
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      security:
        - bearerAuth: []
      operationId: disconnectTwitch
      responses:
        '202':
          description: Solicitação concluída
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: revocation_pending
        '204':
          description: Desconectado
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /channels:
    get:
      security: [{ bearerAuth: [] }]
      operationId: listMonitoringChannels
      responses:
        '200':
          description: Canais monitoráveis
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MonitoringChannel' } }
  /channels/{id}/clip-consent:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getClipConsent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Operação privada concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipConsent' }
        '400':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      security: [{ bearerAuth: [] }]
      operationId: setClipConsent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipConsentRequest' }
      responses:
        '200':
          description: Operação privada concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipConsent' }
        '400':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /channels/{id}/clips:
    get:
      security: [{ bearerAuth: [] }]
      operationId: listClips
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Clips e detecções mínimas do canal autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipSubmissionList' }
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      security: [{ bearerAuth: [] }]
      operationId: submitClip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipSubmissionRequest' }
      responses:
        '200':
          description: Operação privada concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipSubmission' }
        '400':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /channels/{id}/clips/{submissionId}:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getClipDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Metadados e detecções do clip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipDetail' }
        '403':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      security: [{ bearerAuth: [] }]
      operationId: setClipEvidenceApproval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipEvidenceApprovalRequest' }
      responses:
        '200':
          description: Aprovação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipEvidenceApproval' }
        '400':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Solicitação não concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /channels/{id}/clips/{submissionId}/retry:
    post:
      security: [{ bearerAuth: [] }]
      operationId: beginClipManualRetry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tentativa individual iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipManualRetry' }
        '403':
          description: Consentimento ou acesso indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Clip não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Clip não elegível para retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: Outro clip está em processamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /channels/{id}/clips/{submissionId}/retry/captions:
    post:
      security: [{ bearerAuth: [] }]
      operationId: completeClipManualRetryWithCaptions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipManualRetryCaptionsRequest' }
      responses:
        '200':
          description: Captions analisadas sem persistir o texto integral
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipManualRetryResult' }
        '400':
          description: Captions inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Consentimento ou acesso indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Tentativa inválida ou expirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /channels/{id}/clips/{submissionId}/retry/openai:
    post:
      security: [{ bearerAuth: [] }]
      operationId: fallbackClipManualRetryToOpenAi
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipManualRetryTokenRequest' }
      responses:
        '200':
          description: Clip enfileirado para a transcrição OpenAI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipManualRetryResult' }
        '400':
          description: Solicitação inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Consentimento ou acesso indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Tentativa inválida ou expirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /channels/{id}/trigger-phrases:
    get:
      security: [{ bearerAuth: [] }]
      operationId: listClipTriggerPhrases
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Frases configuradas para o canal
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClipTriggerPhrase' } }
    post:
      security: [{ bearerAuth: [] }]
      operationId: createClipTriggerPhrase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipTriggerPhraseRequest' }
      responses:
        '200':
          description: Frase configurada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipTriggerPhrase' }
  /channels/{id}/trigger-phrases/{phraseId}:
    patch:
      security: [{ bearerAuth: [] }]
      operationId: updateClipTriggerPhrase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: phraseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipTriggerPhraseUpdate' }
      responses:
        '200':
          description: Frase atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipTriggerPhrase' }
    delete:
      security: [{ bearerAuth: [] }]
      operationId: deactivateClipTriggerPhrase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: phraseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Frase desativada }
  /channels/{id}/monitoring:
    patch:
      security: [{ bearerAuth: [] }]
      operationId: setChannelMonitoring
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
                consentVersion: { type: string, const: monitoring-v2 }
                consentAccepted: { type: boolean, const: true }
      responses:
        '200':
          description: Estado de monitoramento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringChannel' }
  /sessions:
    get:
      security: [{ bearerAuth: [] }]
      operationId: listMonitoringSessions
      parameters:
        - { name: channelId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          }
      responses:
        '200':
          description: Sessões autorizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringSessionPage' }
  /sessions/{id}:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getMonitoringSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sessão autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringSession' }
  /sessions/{id}/invites:
    get:
      security: [{ bearerAuth: [] }]
      operationId: listSessionInvites
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Convites sem token
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AccessInvite' } }
    post:
      security: [{ bearerAuth: [] }]
      operationId: createSessionInvite
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Token de uso único
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteCreated' }
  /invites/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      operationId: revokeSessionInvite
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Convite revogado }
  /invites/accept:
    post:
      security: [{ bearerAuth: [] }]
      operationId: acceptSessionInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Convite consumido
          content:
            application/json:
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [sessionId],
                  properties: { sessionId: { type: string, format: uuid } }
                }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClipCapability:
      type: string
      description: clip_create é reservado à captura agendada, ainda indisponível.
      enum: [clip_download, clip_create]
    ClipConsent:
      type: object
      additionalProperties: false
      required:
        [
          manualEnabled,
          consentVersion,
          consentedAt,
          revokedAt,
          scheduledEnabled,
          scheduledConsentVersion,
          scheduledConsentedAt,
          scheduledRevokedAt,
          canDownload
        ]
      properties:
        manualEnabled: { type: boolean }
        consentVersion: { type: [string, 'null'], enum: [clip-processing-v1, null] }
        consentedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        scheduledEnabled: { type: boolean }
        scheduledConsentVersion: { type: [string, 'null'], enum: [clip-scheduled-v1, null] }
        scheduledConsentedAt: { type: [string, 'null'], format: date-time }
        scheduledRevokedAt: { type: [string, 'null'], format: date-time }
        canDownload: { type: boolean }
    ClipConsentRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [manualEnabled, consentVersion, consentAccepted]
          properties:
            manualEnabled: { type: boolean, const: true }
            consentVersion: { type: string, const: clip-processing-v1 }
            consentAccepted: { type: boolean, const: true }
        - type: object
          additionalProperties: false
          required: [manualEnabled]
          properties:
            manualEnabled: { type: boolean, const: false }
        - type: object
          additionalProperties: false
          required: [scheduledEnabled, scheduledConsentVersion, scheduledConsentAccepted]
          properties:
            scheduledEnabled: { type: boolean, const: true }
            scheduledConsentVersion: { type: string, const: clip-scheduled-v1 }
            scheduledConsentAccepted: { type: boolean, const: true }
        - type: object
          additionalProperties: false
          required: [scheduledEnabled]
          properties:
            scheduledEnabled: { type: boolean, const: false }
    ClipTriggerPhrase:
      type: object
      additionalProperties: false
      required: [id, text, version, enabled]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 200 }
        version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    ClipTriggerPhraseRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
    ClipTriggerPhraseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
    ClipDetail:
      $ref: '#/components/schemas/ClipSubmissionRecord'
    ClipEvidenceApprovalRequest:
      type: object
      additionalProperties: false
      required: [approved]
      properties:
        approved: { type: boolean }
    ClipEvidenceApproval:
      type: object
      additionalProperties: false
      required: [approvedAt]
      properties:
        approvedAt: { type: [string, 'null'], format: date-time }
    ClipManualRetry:
      type: object
      additionalProperties: false
      required: [state, mode, retryToken, videoId, vodOffset, durationSeconds]
      properties:
        state: { type: string, enum: [processing, pending_captions, needs_trigger_phrases] }
        mode: { type: string, enum: [captions, openai, none] }
        retryToken: { type: [string, 'null'], format: uuid }
        videoId: { type: [string, 'null'] }
        vodOffset: { type: [integer, 'null'], minimum: 0 }
        durationSeconds: { type: [number, 'null'], minimum: 0 }
    ClipManualRetryTokenRequest:
      type: object
      additionalProperties: false
      required: [retryToken]
      properties:
        retryToken: { type: string, format: uuid }
    ClipManualRetrySegment:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs: { type: integer, minimum: 0, maximum: 180000 }
        endMs: { type: integer, minimum: 0, maximum: 180000 }
        text: { type: string, minLength: 1, maxLength: 1000 }
    ClipManualRetryCaptionsRequest:
      type: object
      additionalProperties: false
      required: [retryToken, segments]
      properties:
        retryToken: { type: string, format: uuid }
        segments:
          type: array
          minItems: 1
          maxItems: 300
          items: { $ref: '#/components/schemas/ClipManualRetrySegment' }
    ClipManualRetryResult:
      type: object
      additionalProperties: false
      required: [state, matches]
      properties:
        state:
          {
            type: string,
            enum: [completed, no_match, needs_trigger_phrases, cancelled_consent, pending_captions]
          }
        matches: { type: integer, minimum: 0 }
    ClipSubmissionRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
    ClipSubmission:
      type: object
      additionalProperties: false
      required: [id, state, duplicate]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum:
            [
              pending_metadata,
              pending_captions,
              waiting_capacity,
              needs_trigger_phrases,
              needs_openai_key,
              processing,
              completed,
              no_match,
              source_unavailable,
              failed_retryable,
              failed_terminal,
              cancelled_consent
            ]
        duplicate: { type: boolean }
    ClipDetection:
      type: object
      additionalProperties: false
      required: [phraseId, phraseVersion, phrase, source, startMs, endMs]
      properties:
        phraseId: { type: string }
        phraseVersion: { type: integer, minimum: 1 }
        phrase: { type: string, maxLength: 200 }
        source: { type: string, enum: [captions, openai] }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 0 }
    ClipSubmissionRecord:
      type: object
      additionalProperties: false
      required:
        [
          id,
          clipId,
          canonicalUrl,
          videoId,
          vodOffset,
          title,
          creatorId,
          createdAt,
          durationSeconds,
          language,
          viewCount,
          captureMode,
          state,
          failureCode,
          receivedAt,
          approvedAt,
          detections
        ]
      properties:
        id: { type: string, format: uuid }
        clipId: { type: string }
        canonicalUrl: { type: string, format: uri }
        videoId: { type: [string, 'null'] }
        vodOffset: { type: [integer, 'null'], minimum: 0 }
        title: { type: [string, 'null'] }
        creatorId: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: [number, 'null'], minimum: 0 }
        language: { type: [string, 'null'] }
        viewCount: { type: [integer, 'null'], minimum: 0 }
        captureMode: { type: string, enum: [manual, scheduled] }
        state:
          type: string
          enum:
            [
              pending_metadata,
              pending_captions,
              waiting_capacity,
              needs_trigger_phrases,
              needs_openai_key,
              processing,
              completed,
              no_match,
              source_unavailable,
              failed_retryable,
              failed_terminal,
              cancelled_consent
            ]
        failureCode:
          {
            type: [string, 'null'],
            enum:
              [
                clip_unavailable,
                captions_unavailable,
                transcription_failed,
                quota_exceeded,
                unsupported_language,
                invalid_media,
                provider_error,
                null
              ]
          }
        receivedAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        detections: { type: array, items: { $ref: '#/components/schemas/ClipDetection' } }
    ClipSubmissionList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ClipSubmissionRecord' }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
    OpenAiCredentialStatus:
      type: object
      additionalProperties: false
      required: [configured, systemConfigured]
      properties:
        configured: { type: boolean }
        systemConfigured: { type: boolean }
    OpenAiCredentialUpdate:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 23, maxLength: 503, pattern: '^sk-[A-Za-z0-9_-]+$' }

    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
    Me:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - member
            - vpn_admin
    TwitchConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - providerUserId
        - login
        - status
        - monitoringEnabled
        - canReconnect
        - consentVersion
        - consentedAt
        - connectedAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          const: twitch
        providerUserId:
          type: string
        login:
          type: string
        status:
          type: string
          enum:
            - connected
            - expired
            - revocation_pending
            - revoked
        monitoringEnabled:
          type: boolean
        canReconnect:
          type: boolean
          description: Permite nova autorização com consentimento explícito, sem confirmar revogação remota anterior.
        consentVersion:
          type: string
          const: monitoring-v1
        consentedAt:
          type: string
          format: date-time
        connectedAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    MonitoringChannel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          login,
          providerUserId,
          connectionStatus,
          monitoringEnabled,
          consentVersion,
          subscriptionStatus
        ]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        providerUserId: { type: string }
        connectionStatus: { type: string, enum: [connected, expired, revocation_pending, revoked] }
        monitoringEnabled: { type: boolean }
        consentVersion: { type: [string, 'null'] }
        subscriptionStatus: { type: [string, 'null'], enum: [enabled, pending, error, 'null'] }
    MonitoringSession:
      type: object
      additionalProperties: false
      required:
        [id, channelId, streamId, title, category, startedAt, endedAt, canManageInvites, evidence]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        streamId: { type: string }
        title: { type: string }
        category: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        canManageInvites: { type: boolean }
        evidence: { type: array, items: { $ref: '#/components/schemas/SharedEvidenceClip' } }
    SharedEvidenceClip:
      type: object
      additionalProperties: false
      required: [id, title, canonicalUrl, createdAt, detections]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        canonicalUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        detections: { type: array, items: { $ref: '#/components/schemas/ClipDetection' } }
    MonitoringSessionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MonitoringSession' } }
        nextCursor: { type: [string, 'null'] }
    AccessInvite:
      type: object
      additionalProperties: false
      required: [id, sessionId, expiresAt, createdAt, revokedAt, acceptedAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
    InviteCreated:
      type: object
      additionalProperties: false
      required: [invite, token]
      properties:
        invite: { $ref: '#/components/schemas/AccessInvite' }
        token: { type: string }
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: vpn-sentry
    CityConfig:
      type: object
      required:
        - slug
        - cidade_nome
        - jornal_nome
        - jornal_sigla
        - cor_primaria
        - logo_url
      properties:
        slug:
          type: string
        cidade_nome:
          type: string
        jornal_nome:
          type: string
        jornal_sigla:
          type: string
        cor_primaria:
          type: string
        logo_url:
          type:
            - string
            - 'null'
    Post:
      type: object
      required:
        - id
        - title
        - body
        - cidade
        - cover_url
        - media_url
        - media_type
        - destaque
        - published_at
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        cidade:
          type: string
        cover_url:
          type: string
        media_url:
          type:
            - string
            - 'null'
        media_type:
          type:
            - string
            - 'null'
        destaque:
          type: boolean
        published_at:
          type: string
          format: date-time
