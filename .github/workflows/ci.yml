name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API contracts
        run: pnpm contracts:check

      - name: Foundation tests
        run: pnpm test:foundation

      - name: Install Supabase CLI for build
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start isolated Supabase for build
        id: build-supabase
        run: supabase start

      - name: Configure local public API for prerender
        run: |
          supabase status -o json | jq -r '"NUXT_PUBLIC_SUPABASE_URL=\(.API_URL)\nNUXT_PUBLIC_SUPABASE_KEY=\(.ANON_KEY)"' >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Stop build database
        if: always() && steps.build-supabase.outcome == 'success'
        run: supabase stop --no-backup

  foundation-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start isolated Supabase
        run: supabase start
      - name: Database policies
        run: supabase test db
      - name: Generate schema types for review
        run: supabase gen types typescript --local --schema public,private,graphql_public > foundation-database.types.ts
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-database-types
          path: foundation-database.types.ts
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
